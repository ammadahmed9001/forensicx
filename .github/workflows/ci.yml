name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check src tests forensicx_hub

      - name: Run tests
        run: pytest --tb=short

  registry-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Validate tools registry loads
        run: |
          python3 -c "
          from forensicx_hub.tools_registry import ALL_TOOLS, CATEGORIES
          print(f'Tools registered: {len(ALL_TOOLS)}')
          print(f'Categories: {len(CATEGORIES)}')
          for cat, tools in CATEGORIES.items():
              print(f'  {cat}: {len(tools)} tools')
          assert len(ALL_TOOLS) > 50, 'Expected 50+ tools'
          print('Registry OK')
          "
